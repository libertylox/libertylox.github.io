<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff | skids.wiki</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        :root {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #4ade80;
            --secondary-bg: #1a1a1a;
            --border-color: #222;
            --highlight-color: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle { position: absolute; width: 2px; height: 2px; background: var(--highlight-color); border-radius: 50%; animation: float 10s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) translateX(50px); opacity: 0; } }
        .header { position: fixed; top: 0; left: 0; right: 0; background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--text-color); text-decoration: none; text-transform: lowercase; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; text-transform: lowercase; }
        .nav-link:hover { color: var(--text-color); }
        .main-container { margin-top: 80px; padding: 2rem; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .hero-section { text-align: center; padding: 4rem 0; border-bottom: 1px solid var(--border-color); margin-bottom: 3rem; }
        .hero-title { font-size: 3rem; font-weight: 600; color: var(--text-color); margin-bottom: 1rem; text-transform: lowercase; }
        .hero-subtitle { font-size: 1.1rem; color: #666; margin-bottom: 2rem; text-transform: lowercase; }
        .staff-list { display: flex; flex-direction: column; gap: 1rem; }
        .staff-item { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; transition: all 0.3s ease; }
        .staff-item:hover { background: var(--highlight-color); border-color: #333; transform: translateY(-2px); }
        .staff-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
        .staff-displayname { font-size: 1.2rem; font-weight: 500; color: var(--text-color); text-transform: lowercase; }
        .staff-username { font-size: 0.9rem; color: #666; }
        .staff-role { font-size: 0.8rem; color: var(--accent-color); text-transform: lowercase; }
        .staff-link { color: var(--accent-color); text-decoration: none; font-size: 0.9rem; text-transform: lowercase; }
        .staff-link:hover { color: #22c55e; }
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .nav-links { gap: 1rem; }
            .hero-title { font-size: 2rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <header class="header">
        <a href="/" class="logo">skids.wiki</a>
        <nav class="nav-links">
            <a href="/" class="nav-link">home</a>
            <a href="/staff" class="nav-link">staff</a>
            <a href="https://discord.gg/superskid" class="nav-link">discord</a>
        </nav>
    </header>
    <div class="main-container">
        <section class="hero-section">
            <h1 class="hero-title">staff</h1>
            <p class="hero-subtitle">meet the team behind skids.wiki</p>
        </section>
        <div class="staff-list" id="staffContainer"></div>
    </div>
    <script>
        const staff = [
            {
                id: 1,
                username: "vaalory",
                displayname: "valory",
                role: "Founder & Developer",
                linkmessage: "skids.wiki/valory",
                link: "/valory"
            },
            {
                id: 2,
                username: "_lordeli",
                displayname: "Poptart Consumer",
                role: "Co Founder",
                linkmessage: "skids.wiki/poptart",
                link: "/poptart"
            }
        ];

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(particle);
            }
        }

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.shiftKey && e.key === "S"))
                e.preventDefault();
        });

        function renderStaff() {
            const container = document.getElementById('staffContainer');
            container.innerHTML = '';
            staff.forEach(member => {
                const staffElement = document.createElement('div');
                staffElement.className = 'staff-item';
                staffElement.innerHTML = `
                    <div class="staff-header">
                        <div class="staff-displayname">${member.displayname}</div>
                        <div class="staff-username">@${member.username}</div>
                    </div>
                    <div class="staff-role">${member.role}</div>
                    <a href="${member.link}" class="staff-link">${member.linkmessage}</a>
                `;
                container.appendChild(staffElement);
            });
        }

        function init() {
            createParticles();
            renderStaff();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
