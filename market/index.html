<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Market | skids.wiki</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');

        :root {
            --bg-color: #0d0d0d;
            --text-color: #ffffff;
            --accent-color: #4ade80;
            --secondary-bg: #1a1a1a;
            --border-color: #222;
            --highlight-color: #333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        .header {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(17, 17, 17, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--text-color);
            text-decoration: none;
            text-transform: lowercase;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
        }

        .nav-link {
            color: #888;
            text-decoration: none;
            transition: color 0.3s ease;
            text-transform: lowercase;
        }

        .nav-link:hover {
            color: var(--text-color);
        }

        .main-container {
            margin-top: 80px;
            padding: 2rem;
            max-width: 1200px;
            margin-left: auto;
            margin-right: auto;
        }

        .hero-section {
            text-align: center;
            padding: 4rem 0;
            margin-bottom: 2rem;
        }

        .hero-title {
            font-size: 3rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .hero-subtitle {
            color: #666;
            font-size: 1.1rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }

        .product-card {
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
        }

        .product-image {
            width: 100%;
            height: 400px;
            object-fit: cover;
            border-bottom: 1px solid var(--border-color);
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-descriptionTitle {
            color: #aaa;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .product-description {
            color: #aaa;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .product-descriptionTwo {
            color: #aaa;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .product-price {
            font-size: 1.5rem;
            color: var(--accent-color);
            margin: 1rem 0;
            font-weight: 600;
        }

        .product-meta {
            display: flex;
            justify-content: space-between;
            color: #666;
            font-size: 0.8rem;
            margin-bottom: 1rem;
        }

        .product-type {
            background: var(--highlight-color);
            padding: 0.2rem 0.5rem;
            border-radius: 3px;
        }

        .buy-btn {
            display: block;
            width: 100%;
            padding: 0.7rem;
            background: var(--accent-color);
            color: #000;
            border: none;
            border-radius: 4px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            transition: background 0.3s;
        }

        .buy-btn:hover {
            background: #3bc971;
        }

        .status-indicator {
            position: fixed;
            bottom: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.8rem;
            color: #666;
            background: var(--secondary-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 0.8rem;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.5;
            }
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: 1fr;
            }

            .header {
                padding: 1rem;
            }

            .hero-title {
                font-size: 2rem;
            }
        }
    </style>
</head>

<body>
    <header class="header">
        <a href="/" class="logo">skids.wiki</a>
        <nav class="nav-links">
            <a href="/" class="nav-link">home</a>
            <a href="/market" class="nav-link">market</a>
            <a href="/staff" class="nav-link">staff</a>
            <a href="https://discord.gg/superskid" class="nav-link">discord</a>
        </nav>
    </header>

    <div class="main-container">
        <section class="hero-section">
            <h1 class="hero-title">marketplace</h1>
            <p class="hero-subtitle">superskids marketplace powered by sellauth</p>
        </section>

        <div class="products-grid" id="productsContainer">
            <!-- Products will load here -->
        </div>
    </div>
    <div class="status-indicator">
        <div class="status-dot"></div>
        <span>online</span>
    </div>
    <script>
        (function () {
            document.addEventListener('contextmenu', e => e.preventDefault());

            document.addEventListener('keydown', e => {
                if (e.key === 'F12' ||
                    (e.ctrlKey && e.shiftKey && e.key === 'I') ||
                    (e.ctrlKey && e.key === 'u') ||
                    (e.ctrlKey && e.key === 's') ||
                    (e.metaKey && e.altKey && e.key === 'i')) {
                    e.preventDefault();
                    window.location.href = "/404";
                }
            });

            if (window.top !== window.self) {
                document.body.innerHTML = '<h1 style="color:red">Embedding not allowed</h1>';
            }

            document.onselectstart = () => false;
        })();

        const CONFIG = {
            products: [
                {
                    id: "393655",
                    name: "Netflix Lifetime",
                    descriptionTitle: "🌟 Product Description 🌟",
                    description: "✅ Guaranteed Subscription",
                    descriptionTwo: "✅ Fully Checked Accounts",
                    price: 1.50,
                    type: "one-time",
                    image: "../assets/graphics/Netflix-Graphic.png",
                    checkoutUrl: "https://superskids.mysellauth.com/product/netflix"
                },
                {
                    id: "393946",
                    name: "Spotify Lifetime",
                    descriptionTitle: "🌟 Product Description 🌟",
                    description: "✅ Guaranteed Subscription",
                    descriptionTwo: "✅ Fully Checked Accounts",
                    price: 3.99,
                    type: "one-time",
                    image: "../assets/graphics/Spotify-Graphic.png",
                    checkoutUrl: "https://superskids.mysellauth.com/product/spotify"
                },
                {
                    id: "393655",
                    name: "Crunchyroll Lifetime",
                    descriptionTitle: "🌟 Product Description 🌟",
                    description: "✅ Guaranteed Subscription",
                    descriptionTwo: "✅ Fully Checked Accounts",
                    price: 1.99,
                    type: "one-time",
                    image: "../assets/graphics/Crunchyroll-Graphic.png",
                    checkoutUrl: "https://superskids.mysellauth.com/product/crunchyroll"
                },
                {
                    id: "393655",
                    name: "Steam Lifetime [0-3 GAMES]",
                    descriptionTitle: "🌟 Product Description 🌟",
                    description: "✅ Guaranteed Subscription",
                    descriptionTwo: "✅ Fully Checked Accounts",
                    price: 0.75,
                    type: "one-time",
                    image: "../assets/graphics/Steam-Graphic.png",
                    checkoutUrl: "https://superskids.mysellauth.com/product/steam"
                },
            ]
        };

        function renderProducts() {
            const container = document.getElementById("productsContainer");
            container.innerHTML = CONFIG.products.map(p => `
                <div class="product-card">
                    <img src="${p.image}" class="product-image" 
                         onerror="this.src='https://i.imgur.com/JzqY7yJ.png'">
                    <div class="product-info">
                        <h3>${p.name}</h3>
                        <p>${p.descriptionTitle}</p>
                        <p>${p.description}</p>
                        <p>${p.descriptionTwo}</p>
                        <div class="product-price">$${p.price.toFixed(2)}</div>
                        <a href="${p.checkoutUrl}" class="buy-btn" target="_blank" 
                           onclick="logPurchase('${p.id}')">Buy Now</a>
                    </div>
                </div>
            `).join("");
        }

        function logPurchase(productId) {
            fetch('/api/log', {
                method: 'POST',
                body: JSON.stringify({ productId, userAgent: navigator.userAgent })
            }).catch(() => { });
        }

        if (navigator.userAgent.includes('curl') ||
            navigator.userAgent.includes('Wget') ||
            navigator.userAgent.includes('Python-urllib')) {
            document.body.innerHTML = '<h1>Access denied</h1>';
            window.stop();
        }

        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(renderProducts, 100);
        });
    </script>
    <div style="display:none">© skids.wiki - dont skid our website kids</div>
</body>

</html>
