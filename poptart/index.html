<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>poptart | skids.wiki</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'JetBrains Mono', monospace;
            background: #853c00;
            color: #ffffff;
            overflow: hidden;
            cursor: crosshair;
        }

        .intro-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #632c00;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }

        .intro-content {
            text-align: center;
            animation: fadeIn 2s ease-in-out;
        }

        .intro-text {
            font-size: 2rem;
            font-weight: 500;
            color: #ffffff;
            text-transform: lowercase;
            letter-spacing: 0.1em;
            margin-bottom: 1rem;
        }

        .intro-subtitle {
            font-size: 0.9rem;
            color: #ffffff;
            text-transform: lowercase;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .main-container {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.8s ease;
            background: #b67a14;
        }

        .profile-card {
            background: #b67a14;
            border: 1px solid #c48417;
            border-radius: 8px;
            padding: 3rem;
            width: 90%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5);
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #885b0d;
            margin: 0 auto 2rem;
            display: block;
            object-fit: cover;
        }

        .profile-name {
            font-size: 2rem;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 0.5rem;
            text-transform: lowercase;
        }

        .profile-bio {
            font-size: 0.9rem;
            color: #ffffff;
            margin-bottom: 2rem;
            line-height: 1.5;
        }

        .profile-links {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .profile-link {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            background: #a36e12;
            border: 1px solid #a36e12;
            border-radius: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .profile-link:hover {
            background: #81570e;
            border-color: #81570e;
            transform: translateY(-2px);
        }

        .link-label {
            font-weight: 500;
            text-transform: lowercase;
        }

        .link-value {
            color: #ffffff;
            font-size: 0.8rem;
        }

        .music-player {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #81570e;
            border: 1px solid #81570e;
            border-radius: 6px;
            padding: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 0.8rem;
            z-index: 100;
        }

        .music-info {
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .music-title {
            color: #ffffff;
            font-weight: 500;
        }

        .music-artist {
            color: #d6d6d6;
            font-size: 0.75rem;
        }

        .music-visualizer {
            display: flex;
            align-items: center;
            gap: 2px;
            height: 20px;
        }

        .music-bar {
            width: 3px;
            background: #969696;
            border-radius: 2px;
            animation: musicBars 1s ease-in-out infinite;
        }

        .music-bar:nth-child(1) { animation-delay: 0s; }
        .music-bar:nth-child(2) { animation-delay: 0.1s; }
        .music-bar:nth-child(3) { animation-delay: 0.2s; }
        .music-bar:nth-child(4) { animation-delay: 0.3s; }
        .music-bar:nth-child(5) { animation-delay: 0.4s; }

        @keyframes musicBars {
            0%, 100% { height: 4px; }
            50% { height: 16px; }
        }

        .background-video {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.05;
            z-index: -1;
        }

        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: #333333;
            border-radius: 50%;
            animation: float 10s infinite linear;
        }

        @keyframes float {
            0% { transform: translateY(100vh) translateX(0); opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { transform: translateY(-10vh) translateX(50px); opacity: 0; }
        }

        .hidden {
            opacity: 0;
            pointer-events: none;
        }

        .visible {
            opacity: 1;
            pointer-events: all;
        }

        .status-indicator { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
            display: flex; 
            align-items: center; 
            gap: 0.5rem; 
            font-size: 0.8rem; 
            color: #666; 
            background: var(--secondary-bg); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            padding: 0.8rem; 
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4ade80;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        @media (max-width: 768px) {
            .profile-card {
                padding: 2rem;
                margin: 1rem;
            }
            
            .profile-name {
                font-size: 1.5rem;
            }
            
            .music-player {
                bottom: 10px;
                right: 10px;
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <div class="intro-container" id="introContainer">
        <div class="intro-content">
            <div class="intro-text" id="introText">click to view</div>
            <div class="intro-subtitle">loading...</div>
        </div>
    </div>

    <div class="main-container" id="mainContainer">
        <div class="profile-card">
            <img src="" alt="Profile Avatar" class="profile-avatar" id="profileAvatar">
            <h1 class="profile-name" id="profileName">loading...</h1>
            <p class="profile-bio" id="profileBio">loading...</p>
            <div class="profile-links" id="profileLinks"></div>
        </div>
    </div>

    <div class="status-indicator">
        <div class="status-dot"></div>
        <span>online</span>
    </div>

    <div class="music-player" id="musicPlayer">
        <div class="music-info">
            <div class="music-title" id="musicTitle">no track selected</div>
            <div class="music-artist" id="musicArtist">unknown artist</div>
        </div>
        <div class="music-visualizer">
            <div class="music-bar"></div>
            <div class="music-bar"></div>
            <div class="music-bar"></div>
            <div class="music-bar"></div>
            <div class="music-bar"></div>
        </div>
    </div>

    <audio id="backgroundMusic" loop></audio>

    <script>
        const CONFIG_URL = '../poptart/config.json';
        const MUSIC_VOLUME = 0.3;
        
        let config = {};
        let audio = null;

        async function loadConfig() {
            try {
                const response = await fetch(CONFIG_URL);
                config = await response.json();
            } catch (error) {
                console.log('Config file not found, using defaults');
                config = {
                    "name": "#",
                    "bio": "#",
                    "avatar": "#",
                    "music": {
                        "title": "#",
                        "artist": "#",
                        "file": "#"
                    },
                    "links": [
                        { "label": "#", "value": "#", "url": "#" },
                        { "label": "#", "value": "#", "url": "#" },
                        { "label": "#", "value": "#", "url": "#" },
                        { "label": "#", "value": "#", "url": "#" }
                    ]
                };
            }
        }

        function initializeProfile() {
            document.getElementById('profileName').textContent = config.name;
            document.getElementById('profileBio').textContent = config.bio;
            document.getElementById('profileAvatar').src = config.avatar;
            
            if (config.music) {
                document.getElementById('musicTitle').textContent = config.music.title;
                document.getElementById('musicArtist').textContent = config.music.artist;
                audio = document.getElementById('backgroundMusic');
                audio.src = config.music.file;
                audio.volume = MUSIC_VOLUME;
            }
            
            const linksContainer = document.getElementById('profileLinks');
            linksContainer.innerHTML = '';
            
            config.links.forEach(link => {
                const linkElement = document.createElement('a');
                linkElement.className = 'profile-link';
                linkElement.href = link.url;
                linkElement.target = '_blank';
                linkElement.innerHTML = `
                    <span class="link-label">${link.label}</span>
                    <span class="link-value">${link.value}</span>
                `;
                linksContainer.appendChild(linkElement);
            });
        }

        function createParticles() {
            const container = document.getElementById('particles');
            
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(particle);
            }
        }

        function keepMusicPlaying() {
            if (audio) {
                audio.addEventListener('ended', () => {
                    audio.currentTime = 0;
                    audio.play().catch(e => console.log('Audio restart blocked'));
                });
                
                audio.addEventListener('pause', () => {
                    setTimeout(() => {
                        audio.play().catch(e => console.log('Audio resume blocked'));
                    }, 100);
                });
            }
        }

        function enterProfile() {
            const intro = document.getElementById('introContainer');
            const main = document.getElementById('mainContainer');
            
            intro.classList.add('hidden');
            main.classList.add('visible');
            
            if (audio) {
                audio.play().catch(e => console.log('Audio blocked'));
                keepMusicPlaying();
            }
        }

        async function init() {
            await loadConfig();
            initializeProfile();
            createParticles();
            
            document.getElementById('introContainer').addEventListener('click', enterProfile);
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
