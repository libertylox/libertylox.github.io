<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-config="profile.name"></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="intro-screen" id="introScreen">
        <div class="intro-content">
            <div class="pulse-circle" data-config="intro.enable_pulse_circle" style="display: none;"></div>
            <h1 class="intro-title" data-config="intro.title"></h1>
            <p class="intro-subtitle" data-config="intro.subtitle"></p>
        </div>
        <div class="particles" data-config="animations.enable_particles" style="display: none;"></div>
    </div>
    <div class="main-content" id="mainContent" style="display: none;">
        <div class="background-overlay"></div>
        <div class="profile-container">
            <div class="profile-header">
                <div class="avatar-container">
                    <img src="" alt="Avatar" class="avatar" data-config="profile.avatar">
                    <div class="avatar-ring"></div>
                </div>
                <h1 class="profile-name" data-config="profile.name"></h1>
                <p class="profile-title" data-config="profile.title"></p>
                <div class="profile-status">
                    <span class="status-dot"></span>
                    <span class="status-text" data-config="profile.status"></span>
                </div>
            </div>
            <div class="profile-stats">
                <div class="stat-item">
                    <span class="stat-number" data-config="stats.followers"></span>
                    <span class="stat-label">Followers</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-config="stats.following"></span>
                    <span class="stat-label">Following</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" data-config="stats.projects"></span>
                    <span class="stat-label">Projects</span>
                </div>
            </div>
            <div class="profile-bio">
                <p data-config="profile.bio"></p>
            </div>
            <div class="social-links" data-config="social_links"></div>
            <div class="music-control">
                <button class="music-toggle" id="musicToggle">
                    <svg class="play-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                    <svg class="pause-icon" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" style="display: none;">
                        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                    </svg>
                </button>
                <span class="music-title" data-config="profile.music_title"></span>
            </div>
        </div>
    </div>
    <audio id="backgroundMusic" loop>
        <source src="" type="audio/mpeg" data-config="profile.music_file">
    </audio>
    <script src="script.js"></script>
</body>
</html>
