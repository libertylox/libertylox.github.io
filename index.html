<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | skids.wiki</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        :root {
            --bg-color: #0d0d0d; 
            --text-color: #ffffff;
            --accent-color: #4ade80;
            --secondary-bg: #1a1a1a;
            --border-color: #222;
            --highlight-color: #333;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; }
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle { position: absolute; width: 2px; height: 2px; background: var(--highlight-color); border-radius: 50%; animation: float 10s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) translateX(50px); opacity: 0; } }
        .header { position: fixed; top: 0; left: 0; right: 0; background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--text-color); text-decoration: none; text-transform: lowercase; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; text-transform: lowercase; }
        .nav-link:hover { color: var(--text-color); }
        .main-container { margin-top: 80px; padding: 2rem; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .hero-section { text-align: center; padding: 4rem 0; border-bottom: 1px solid var(--border-color); margin-bottom: 3rem; }
        .hero-title { font-size: 3rem; font-weight: 600; color: var(--text-color); margin-bottom: 1rem; text-transform: lowercase; }
        .hero-subtitle { font-size: 1.1rem; color: #666; margin-bottom: 2rem; text-transform: lowercase; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 3rem; }
        .stat-card { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; text-align: center; }
        .stat-number { font-size: 2rem; font-weight: 600; color: var(--accent-color); margin-bottom: 0.5rem; }
        .stat-label { font-size: 0.9rem; color: #666; text-transform: lowercase; }
        .content-grid { display: grid; grid-template-columns: 1fr 300px; gap: 2rem; }
        .posts-section { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 2rem; }
        .section-title { font-size: 1.5rem; font-weight: 600; color: var(--text-color); margin-bottom: 1.5rem; text-transform: lowercase; }
        .post-item { background: var(--secondary-bg); border: 1px solid #2a2a2a; border-radius: 6px; padding: 1.5rem; margin-bottom: 1rem; transition: all 0.3s ease; }
        .post-item:hover { background: var(--highlight-color); border-color: #333; transform: translateY(-2px); }
        .post-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; }
        .post-title { font-size: 1.1rem; font-weight: 500; color: var(--text-color); text-transform: lowercase; }
        .post-date { font-size: 0.8rem; color: #666; }
        .post-content { color: #ccc; margin-bottom: 1rem; font-size: 0.9rem; }
        .post-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: #ffffff; }
        .post-type { background: var(--highlight-color); padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.7rem; text-transform: lowercase; }
        .post-link { background: #979899; padding: 0.2rem 0.5rem; border-radius: 3px; font-size: 0.7rem; text-transform: lowercase; }
        .file-type { background: var(--accent-color); color: #000; }
        .text-type { background: #3b82f6; }
        .link-type { background: #f59e0b; }
        .project-type { background: #f5550b; }
        .sidebar { display: flex; flex-direction: column; gap: 2rem; }
        .sidebar-widget { background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 8px; padding: 1.5rem; }
        .widget-title { font-size: 1.1rem; font-weight: 500; color: var(--text-color); margin-bottom: 1rem; text-transform: lowercase; }
        .recent-item { display: flex; justify-content: space-between; align-items: center; padding: 0.5rem 0; border-bottom: 1px solid var(--border-color); }
        .recent-item:last-child { border-bottom: none; }
        .recent-title { font-size: 0.9rem; color: #ccc; text-transform: lowercase; }
        .recent-date { font-size: 0.7rem; color: #666; }
        .status-indicator { position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #666; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.8rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent-color); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        @media (max-width: 768px) {
            .content-grid { grid-template-columns: 1fr; }
            .header { padding: 1rem; }
            .nav-links { gap: 1rem; }
            .hero-title { font-size: 2rem; }
            .stats-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    <header class="header">
        <a href="/" class="logo">skids.wiki</a>
        <nav class="nav-links">
            <a href="/" class="nav-link">home</a>
            <a href="/staff" class="nav-link">staff</a>
            <a href="https://discord.gg/superskid" class="nav-link">discord</a>
        </nav>
    </header>
    <div class="main-container">
        <section class="hero-section">
            <h1 class="hero-title">skids.wiki</h1>
            <p class="hero-subtitle">discord.gg/superskid official website for out file sharing/hosting</p>
        </section>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">1</div>
                <div class="stat-label">total posts</div>
            </div>
            <!-- <div class="stat-card">
                <div class="stat-number" id="totalFiles">12</div>

            </div> -->
            <!-- <div class="stat-card">
                <div class="stat-number" id="totalViews">1.2k</div>
                <div class="stat-label">total views</div>
            </div> -->
            <div class="stat-card">
                <div class="stat-number" id="lastUpdate">07-10-25</div>
                <div class="stat-label">last update</div>
            </div>
        </div>
        <div class="content-grid">
            <main class="posts-section">
                <h2 class="section-title">all posts</h2>
                <div id="postsContainer"></div>
            </main>
            <aside class="sidebar">
                <div class="sidebar-widget">
                    <h3 class="widget-title">quick stats</h3>
                    <div class="recent-item">
                        <span class="recent-title">server uptime</span>
                        <span class="recent-date">99.9%</span>
                    </div>
                    <div class="recent-item">
                        <span class="recent-title">storage used</span>
                        <span class="recent-date">0.019gb</span>
                    </div>
                    <!-- <div class="recent-item">
                        <span class="recent-title">last backup</span>
                        <span class="recent-date">2h ago</span>
                    </div> -->
                </div>
                <!-- <div class="sidebar-widget">
                    <h3 class="widget-title">recent activity</h3>
                    <div id="recentActivity"></div>
                </div>
                <div class="sidebar-widget">
                    <h3 class="widget-title">file types</h3>
                    <div class="recent-item">
                        <span class="recent-title">documents</span>
                        <span class="recent-date">8</span>
                    </div>
                    <div class="recent-item">
                        <span class="recent-title">images</span>
                        <span class="recent-date">15</span>
                    </div>
                    <div class="recent-item">
                        <span class="recent-title">code</span>
                        <span class="recent-date">6</span>
                    </div>
                    <div class="recent-item">
                        <span class="recent-title">archives</span>
                        <span class="recent-date">3</span>
                    </div>
                </div> -->
            </aside>
        </div>
    </div>
    <div class="status-indicator">
        <div class="status-dot"></div>
        <span>online</span>
    </div>
    <script>
        let posts = [
            { 
                id: 1, 
                title: "welcome to skids.wiki", 
                content: "this is the official website for discord.gg/superskid scroll through or explore more options or other things within our site.", 
                type: "text", 
                date: "2025-07-08", 
                views: "https://skids.wiki" 
            },
            { 
                id: 2, 
                title: "<b>Summer 2022</b>", 
                content: "This is the Summer 2022 project of gorilla tag, ported to unity so you can mess around or create a game with it! We used unity 2019 for this project as thats what it requires us to use when Asset Ripping the project.", 
                type: "file", 
                date: "2025-10-08", 
                views: "https://www.mediafire.com/file/9qw9ub88tenk6c8/Summer_2022_-_VALORY_MADE_THIS_YOU_SKIDDERS.zip/file" 
            },
        ];

        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(particle);
            }
        }

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "S"))
                e.preventDefault();
        });

        function formatDate(dateString) {
            const date = new Date(dateString);
            const now = new Date();
            const diff = now - date;
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            if (days === 0) return 'today';
            if (days === 1) return '1 day ago';
            if (days < 7) return `${days} days ago`;
            if (days < 30) return `${Math.floor(days / 7)} weeks ago`;
            return `${Math.floor(days / 30)} months ago`;
        }

        function renderPosts() {
            const container = document.getElementById('postsContainer');
            container.innerHTML = '';
            posts.forEach(post => {
                const postElement = document.createElement('div');
                postElement.className = 'post-item';
                const typeClass = post.type === 'file' ? 'file-type' : post.type === 'link' ? 'link-type' : 'text-type';
                postElement.innerHTML = `
                        <div class="post-header">
                            <div class="post-title">${post.title}</div>
                            <div class="post-date">${formatDate(post.date)}</div>
                        </div>
                        <div class="post-content">${post.content}</div>
                        <div class="post-meta">
                            <span class="post-type ${typeClass}">${post.type}</span>
                            <a class="post-link" href="${post.views}">Link</a>
                        </div>
                    `;
                container.appendChild(postElement);
            });
        }

        function init() {
            createParticles();
            renderPosts();
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
