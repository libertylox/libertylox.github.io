<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home | skids.wiki</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <a href="/" class="logo">skids.wiki</a>
        <nav class="nav-links">
            <a href="/" class="nav-link">home</a>
            <a href="/market" class="nav-link">market</a>
            <a href="/staff" class="nav-link">staff</a>
            <a href="https://discord.gg/superskid" class="nav-link">discord</a>
        </nav>
    </header>
    <div class="main-container">
        <section class="hero-section">
            <h1 class="hero-title">skids.wiki</h1>
            <p class="hero-subtitle">discord.gg/superskid official website for out file sharing/hosting</p>
        </section>
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalPosts">2</div>
                <div class="stat-label">total posts</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="lastUpdate"></div>
                <div class="stat-label">last update</div>
            </div>
        </div>
        <div class="content-grid">
            <main class="posts-section">
                <h2 class="section-title">all posts</h2>
                <div id="postsContainer"></div>
            </main>
            <aside class="sidebar">
                <div class="sidebar-widget">
                    <h3 class="widget-title">quick stats</h3>
                    <div class="recent-item">
                        <span class="recent-title">server uptime</span>
                        <span class="recent-date">99.9%</span>
                    </div>
                    <div class="recent-item">
                        <span class="recent-title">storage used</span>
                        <span class="recent-date">0.019gb</span>
                    </div>
                </div>
            </aside>
        </div>
    </div>
    <div class="status-indicator">
        <div class="status-dot"></div>
        <span>online</span>
    </div>
    <script src="script.js"></script>
    <div style="display:none">© skids.wiki - dont skid our website kids</div>
</body>
</html>
