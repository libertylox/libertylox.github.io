<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | skids.wiki</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap');
        :root {
            --bg-color: #0d0d0d; 
            --text-color: #ffffff;
            --accent-color: #4ade80;
            --secondary-bg: #1a1a1a;
            --border-color: #222;
            --highlight-color: #333;
            --error-color: #ef4444;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'JetBrains Mono', monospace; background: var(--bg-color); color: var(--text-color); line-height: 1.6; overflow-x: hidden; min-height: 100vh; display: flex; flex-direction: column; }
        
        .particles { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
        .particle { position: absolute; width: 2px; height: 2px; background: var(--highlight-color); border-radius: 50%; animation: float 10s infinite linear; }
        @keyframes float { 0% { transform: translateY(100vh) translateX(0); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 1; } 100% { transform: translateY(-10vh) translateX(50px); opacity: 0; } }
        
        .header { position: fixed; top: 0; left: 0; right: 0; background: rgba(17, 17, 17, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 1rem 2rem; z-index: 100; display: flex; justify-content: space-between; align-items: center; }
        .logo { font-size: 1.5rem; font-weight: 600; color: var(--text-color); text-decoration: none; text-transform: lowercase; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link { color: #888; text-decoration: none; font-size: 0.9rem; transition: color 0.3s ease; text-transform: lowercase; }
        .nav-link:hover { color: var(--text-color); }
        
        .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; margin-top: 80px; }
        .error-section { text-align: center; max-width: 600px; padding: 3rem; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 12px; box-shadow: 0 0 30px rgba(0, 0, 0, 0.5); }
        
        .error-code { font-size: 8rem; font-weight: 600; color: var(--error-color); margin-bottom: 1rem; text-transform: lowercase; text-shadow: 0 0 20px rgba(239, 68, 68, 0.3); }
        @keyframes glitch {
            0%, 100% { transform: translate(0); }
            20% { transform: translate(-2px, 2px); }
            40% { transform: translate(-2px, -2px); }
            60% { transform: translate(2px, 2px); }
            80% { transform: translate(2px, -2px); }
        }
        
        .error-title { font-size: 2rem; font-weight: 600; color: var(--text-color); margin-bottom: 1rem; text-transform: lowercase; }
        .error-subtitle { font-size: 1.1rem; color: #666; margin-bottom: 2rem; text-transform: lowercase; }
        
        .error-actions { display: flex; gap: 1rem; justify-content: center; margin-bottom: 2rem; flex-wrap: wrap; }
        .btn { padding: 0.75rem 1.5rem; border: 1px solid var(--border-color); border-radius: 6px; text-decoration: none; font-family: inherit; font-size: 0.9rem; text-transform: lowercase; transition: all 0.3s ease; cursor: pointer; }
        .btn-primary { background: var(--accent-color); color: #000; border-color: var(--accent-color); }
        .btn-primary:hover { background: #22c55e; border-color: #22c55e; transform: translateY(-2px); }
        .btn-secondary { background: transparent; color: var(--text-color); }
        .btn-secondary:hover { background: var(--highlight-color); transform: translateY(-2px); }
        
        .status-indicator { position: fixed; bottom: 20px; right: 20px; display: flex; align-items: center; gap: 0.5rem; font-size: 0.8rem; color: #666; background: var(--secondary-bg); border: 1px solid var(--border-color); border-radius: 6px; padding: 0.8rem; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--error-color); animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        @media (max-width: 768px) {
            .header { padding: 1rem; }
            .nav-links { gap: 1rem; }
            .error-code { font-size: 5rem; }
            .error-title { font-size: 1.5rem; }
            .error-actions { flex-direction: column; align-items: center; }
            .btn { width: 100%; max-width: 200px; }
            .main-container { padding: 1rem; }
            .error-section { padding: 2rem; }
        }
    </style>
</head>
<body>
    <div class="particles" id="particles"></div>
    
    <header class="header">
        <a href="/" class="logo">skids.wiki</a>
        <nav class="nav-links">
            <a href="/" class="nav-link">home</a>
            <a href="/market" class="nav-link">market</a>
            <a href="/staff" class="nav-link">staff</a>
            <a href="https://discord.gg/superskid" class="nav-link">discord</a>
        </nav>
    </header>
    
    <div class="main-container">
        <section class="error-section">
            <div class="error-code">404</div>
            <h1 class="error-title">page not found</h1>
            <p class="error-subtitle">the page you're looking for doesn't exist or has been moved</p>
            
            <div class="error-actions">
                <a href="/" class="btn btn-primary">go home</a>
                <a href="javascript:history.back()" class="btn btn-secondary">go back</a>
            </div>
        </section>
    </div>
    
    <div class="status-indicator">
        <div class="status-dot"></div>
        <span>error</span>
    </div>
    
    <script>
        function createParticles() {
            const container = document.getElementById('particles');
            for (let i = 0; i < 30; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 10 + 's';
                particle.style.animationDuration = (Math.random() * 5 + 5) + 's';
                container.appendChild(particle);
            }
        }

        document.addEventListener("contextmenu", e => e.preventDefault());
        document.addEventListener("keydown", e => {
            if (e.key === "F12" || (e.ctrlKey && e.shiftKey && e.key === "I") || (e.ctrlKey && e.key === "S"))
                e.preventDefault();
        });

        function formatDate(date) {
            return date.toLocaleString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit' 
            });
        }

        function init() {
            createParticles();
            
            document.getElementById('currentUrl').textContent = window.location.pathname;
            document.getElementById('timestamp').textContent = formatDate(new Date());
            
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
    <div style="display:none">© skids.wiki - dont skid our website kids</div>
</body>
</html>
